name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: 构建 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2

      # 注：未做 cargo fmt 校验——rustfmt 目前在 src/utils.rs 的多行常量上报内部错误，
      # 待该处理顺后再恢复 fmt 门禁。clippy 已作为静态检查门禁。
      - name: Clippy（warnings 视为错误）
        run: cargo clippy -- -D warnings

      - name: 构建
        run: cargo build --verbose

      - name: 测试
        run: cargo test --verbose
